<body class="antialiased selection:bg-primary selection:text-white relative">

    <div id="root"></div>
    <div id="toast" class="toast flex items-center gap-3"><i id="toast-icon" class="text-[24px]"></i><span id="toast-msg"></span></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Supabase configuration is loaded from config.js.
        const SUPABASE_URL = String(window.PAWON_CONFIG?.supabaseUrl || '').trim();
        const SUPABASE_ANON_KEY = String(window.PAWON_CONFIG?.supabaseAnonKey || '').trim();
        const STORAGE_BUCKET = String(window.PAWON_CONFIG?.storageBucket || 'pawon-assets').trim();
        const hasSupabaseConfig = /^https:\/\/[^\s]+\.supabase\.co(?:\/.*)?$/i.test(SUPABASE_URL) && SUPABASE_ANON_KEY && !/YOUR_|your-anon-key/i.test(SUPABASE_ANON_KEY);

        const normalizeSocialUrl = (value, network) => {
            const v = String(value || '').trim();
            if (!v) return '';
            if (/^https?:\/\//i.test(v)) return v;
            if (network === 'instagram') return `https://instagram.com/${v.replace(/^@/, '')}`;
            if (network === 'tiktok') return `https://tiktok.com/@${v.replace(/^@/, '')}`;
            if (network === 'facebook') return `https://facebook.com/${v.replace(/^@/, '')}`;
            return v;
        };

        const normalizeWhatsApp = (value) => {
            let v = String(value || '').replace(/\D/g, '');
            if (v.startsWith('0')) v = '62' + v.slice(1);
            return v;
        };

        let supabaseClient = null;
        try {
            if (window.supabase && hasSupabaseConfig) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.warn("Supabase init warning:", e);
        }

        // Fallback LocalStorage jika Supabase belum dikonfigurasi penuh
        const LocalStorageDB = {
            get(key, defaultVal) {
                const item = localStorage.getItem('pk_' + key);
                return item ? JSON.parse(item) : defaultVal;
            },
            set(key, val) {
                localStorage.setItem('pk_' + key, JSON.stringify(val));
            }
        };

        const showToast = (msg, isError = false) => {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            const iconEl = document.getElementById('toast-icon');
            iconEl.className = `ph ${isError ? 'ph-warning-circle text-red-500' : 'ph-check-circle text-green-500'} text-[24px]`;
            t.style.border = `1px solid ${isError ? 'rgba(239,68,68,0.3)' : 'rgba(16,185,129,0.3)'}`;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3500);
        };

        const processImageFile = (file, maxWidth = 1000) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ratio = maxWidth / img.width;
                        canvas.width = img.width > maxWidth ? maxWidth : img.width;
                        canvas.height = img.width > maxWidth ? img.height * ratio : img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/webp', 0.8));
                    };
                };
                reader.onerror = error => reject(error);
            });
        };

        const Icon = ({ name, size = 24, className = "", weight="regular" }) => (
            <i className={`ph ${name} text-[${size}px] ${className}`} style={{fontSize: size}} weight={weight}></i>
        );

            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

        const Hero = ({ settings, setRoute }) => {
            return (
                <section id="home" className="relative min-h-[100vh] flex items-center pt-24 overflow-hidden">
                    <div className="absolute inset-0 bg-gradient-to-b from-transparent via-darker/50 to-darker z-0"></div>
                    <div className="absolute top-1/4 -left-32 w-[500px] h-[500px] bg-primary/20 rounded-full mix-blend-screen filter blur-[120px] animate-blob z-0"></div>
                    <div className="absolute bottom-1/4 -right-32 w-[500px] h-[500px] bg-accent/20 rounded-full mix-blend-screen filter blur-[120px] animate-blob animation-delay-2000 z-0"></div>
                    
                    <div className="container mx-auto px-6 relative z-10 grid lg:grid-cols-2 gap-12 items-center mt-10 lg:mt-0">

                                            <input type="text" placeholder="Nama Layanan" value={editingItem.name} onChange={e=>setEditingItem({...editingItem, name:e.target.value})} className="w-full bg-dark border border-white/10 rounded-xl p-4 text-white outline-none"/>
                                            <textarea placeholder="Deskripsi" value={editingItem.desc} onChange={e=>setEditingItem({...editingItem, desc:e.target.value})} className="w-full bg-dark border border-white/10 rounded-xl p-4 text-white outline-none" rows="3"/>
                                            <input type="text" placeholder="Harga" value={editingItem.price} onChange={e=>setEditingItem({...editingItem, price:e.target.value})} className="w-full bg-dark border border-white/10 rounded-xl p-4 text-white outline-none"/>
                                        </div>
                                    )}
                                    {modalType === 'portfolio' && (
                                        <div className="space-y-4">
                                            <input type="text" placeholder="Judul" value={editingItem.title} onChange={e=>setEditingItem({...editingItem, title:e.target.value})} className="w-full bg-dark border border-white/10 rounded-xl p-4 text-white outline-none"/>
                                            <input type="text" placeholder="Kategori" value={editingItem.category} onChange={e=>setEditingItem({...editingItem, category:e.target.value})} className="w-full bg-dark border border-white/10 rounded-xl p-4 text-white outline-none"/>
                                            <input type="file" accept="image/*" onChange={(e)=>handleImageSelect(e, 'img')} className="text-sm text-gray-400"/>
                                            {editingItem.img && <img src={editingItem.img} className="h-24 rounded object-cover"/>}
                                        </div>
                                    )}
                                    {modalType === 'pricing' && (
                                        <div className="space-y-4">
                                            <input type="text" placeholder="Nama Paket" value={editingItem.name} onChange={e=>setEditingItem({...editingItem, name:e.target.value})} className="w-full bg-dark border border-white/10 rounded-xl p-4 text-white outline-none"/>
                                            <input type="text" placeholder="Harga" value={editingItem.price} onChange={e=>setEditingItem({...editingItem, price:e.target.value})} className="w-full bg-dark border border-white/10 rounded-xl p-4 text-white outline-none"/>
                                            <textarea placeholder="Fitur (pisahkan koma)" value={(editingItem.features||[]).join(',')} onChange={e=>setEditingItem({...editingItem, features:e.target.value.split(',')})} className="w-full bg-dark border border-white/10 rounded-xl p-4 text-white outline-none" rows="3"/>
                                        </div>
                                    )}
                                    {modalType === 'testimonials' && (
                                        <div className="space-y-4">
                                            <input type="text" placeholder="Nama" value={editingItem.name} onChange={e=>setEditingItem({...editingItem, name:e.target.value})} className="w-full bg-dark border border-white/10 rounded-xl p-4 text-white outline-none"/>
                                            <input type="text" placeholder="Kota" value={editingItem.city} onChange={e=>setEditingItem({...editingItem, city:e.target.value})} className="w-full bg-dark border border-white/10 rounded-xl p-4 text-white outline-none"/>
                                            <textarea placeholder="Komentar" value={editingItem.comment} onChange={e=>setEditingItem({...editingItem, comment:e.target.value})} className="w-full bg-dark border border-white/10 rounded-xl p-4 text-white outline-none" rows="3"/>
                                        </div>
                                    )}
                                    {modalType === 'team' && (
                                        <div className="space-y-4">
                                            <input type="text" placeholder="Nama anggota tim" value={editingItem.name || ''} onChange={e=>setEditingItem({...editingItem, name:e.target.value})} className="w-full bg-dark border border-white/10 rounded-xl p-4 text-white outline-none"/>
                                            <input type="text" placeholder="Jabatan / Peran" value={editingItem.role || ''} onChange={e=>setEditingItem({...editingItem, role:e.target.value})} className="w-full bg-dark border border-white/10 rounded-xl p-4 text-white outline-none"/>
                                            <textarea placeholder="Bio singkat" value={editingItem.bio || ''} onChange={e=>setEditingItem({...editingItem, bio:e.target.value})} className="w-full bg-dark border border-white/10 rounded-xl p-4 text-white outline-none" rows="3"/>
                                            <input type="file" accept="image/*" onChange={(e)=>handleImageSelect(e, 'photo')} className="text-sm text-gray-400"/>
                                            {editingItem.photo && <img src={editingItem.photo} className="h-28 w-28 rounded-2xl object-cover border border-white/10"/>}
                                        </div>
                                    )}
                                    {modalType === 'faq' && (
                                        <div className="space-y-4">
                                            <input type="text" placeholder="Pertanyaan" value={editingItem.q} onChange={e=>setEditingItem({...editingItem, q:e.target.value})} className="w-full bg-dark border border-white/10 rounded-xl p-4 text-white outline-none"/>
                                            <textarea placeholder="Jawaban" value={editingItem.a} onChange={e=>setEditingItem({...editingItem, a:e.target.value})} className="w-full bg-dark border border-white/10 rounded-xl p-4 text-white outline-none" rows="3"/>
                                        </div>
                                    )}
                                    {modalType === 'order_detail' && (
                                        <div className="space-y-3 text-sm text-gray-300">
                                            <p><strong>Nama:</strong> {editingItem.name}</p>
                                            <p><strong>WhatsApp:</strong> {editingItem.wa}</p>
                                            <p><strong>Layanan:</strong> {editingItem.service} ({editingItem.paket})</p>
                                            <p><strong>Detail:</strong> {editingItem.detail}</p><p><strong>Deadline:</strong> {editingItem.deadline || '-'}</p><p><strong>Budget:</strong> Rp {editingItem.budget || '-'}</p><p><strong>Catatan:</strong> {editingItem.notes || '-'}</p><p><strong>Status:</strong> {editingItem.status || 'Baru'}</p><div className="pt-3"><button onClick={()=>printInvoice(editingItem)} className="px-4 py-3 rounded-xl bg-primary text-white font-bold">Cetak / Simpan Invoice PDF</button></div>
                                        </div>
                                    )}
                                    <div className="mt-8 flex gap-4 justify-end">
                                        <button onClick={()=>setModalType(null)} className="px-6 py-3 rounded-xl bg-white/10 text-white font-medium">Tutup</button>
                                        {modalType !== 'order_detail' && (
                                            <button onClick={()=>handleSaveItem(activeTab, editingItem)} className="px-6 py-3 rounded-xl bg-primary text-white font-bold">Simpan</button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [route, setRoute] = useState(() => {
                const r = window.location.hash.replace('#', '');
                return r.startsWith('admin') ? r : (r==='order' ? 'order' : 'home');
            });
            const [loading, setLoading] = useState(true);

            // Default Initial State Data
            const [settings, setSettings] = useState(LocalStorageDB.get('settings', {
                brandName: 'PAWON KREATIF', tagline: 'IDE MU. DESAIN KAMI.',
                waNumber: '6285956309009', email: 'hello@pawonkreatif.com', address: 'Desa Lendang Tampel, Kecamatan Batukliang, Kabupaten Lombok Tengah',
                jamKerja: 'Senin–Sabtu, 08.00–21.00 WITA', logoUrl: '', faviconUrl: '', ig: '', fb: '', tiktok: '', mapsUrl: '',
                heroTitle: 'Solusi Desain Kreatif, Buat Brand Anda Lebih', heroHighlight: 'Berkelas',
                heroDesc: 'Kami membantu membuat berbagai kebutuhan desain digital dengan tampilan profesional, modern, dan sesuai karakter brand Anda.', heroBadge: 'STUDIO DESAIN DIGITAL • LOMBOK',
                seoTitle: 'Pawon Kreatif | Jasa Desain Digital Premium', seoDescription: 'Jasa desain digital profesional untuk branding, sosial media, undangan, banner, dan kebutuhan visual bisnis.',
                ctaTitle: 'Siap membuat brand Anda terlihat lebih profesional?', ctaDesc: 'Ceritakan kebutuhan desain Anda. Kami bantu dari ide sampai file siap digunakan.',
                primaryColor: '#3b82f6', accentColor: '#8b5cf6', bgType: 'image'
            }));

            const [services, setServices] = useState(LocalStorageDB.get('services', [
                { id: '1', name: 'Desain Logo', desc: 'Logo bisnis, organisasi, dan personal branding.', price: '75.000', icon: 'ph-pen-nib', order: 1 },
                { id: '2', name: 'Desain Undangan', desc: 'Undangan pernikahan digital & cetak.', price: '35.000', icon: 'ph-envelope-simple', order: 2 },
                { id: '3', name: 'Desain Sosial Media', desc: 'Feed Instagram, story, dan konten promosi.', price: '50.000', icon: 'ph-instagram-logo', order: 3 },
                { id: '4', name: 'Desain Banner', desc: 'Banner digital, spanduk, dan promosi usaha.', price: '45.000', icon: 'ph-flag', order: 4 }
            ]));

            const [portfolio, setPortfolio] = useState(LocalStorageDB.get('portfolio', [
                { id: '1', title: 'Brand Identity Kedai Kopi', category: 'Logo', img: 'https://images.unsplash.com/photo-1626785774573-4b799315345d?w=600&auto=format&fit=crop&q=80', desc: 'Modern minimalist coffee shop branding.', order: 1 },
                { id: '2', title: 'Undangan Pernikahan Elegan', category: 'Undangan', img: 'https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=600&auto=format&fit=crop&q=80', desc: 'Floral aesthetic digital invitation.', order: 2 }
            ]));

            const [pricing, setPricing] = useState(LocalStorageDB.get('pricing', [
                { id: '1', name: 'BASIC', price: '49.000', desc: 'Cocok untuk kebutuhan cepat & simple', features: ['1 Konsep Desain', '2x Revisi', 'File JPG/PNG HD', 'Estimasi 1 Hari'], isPremium: false, order: 1 },
                { id: '2', name: 'STANDARD', price: '99.000', desc: 'Pilihan terbaik untuk UMKM & Bisnis', features: ['2 Konsep Pilihan', 'Revisi Fleksibel', 'File Master (PSD/AI/CDR)', 'Estimasi 2 Hari'], isPremium: true, order: 2 },
                { id: '3', name: 'PREMIUM', price: '199.000', desc: 'Full support eksklusif & komplit', features: ['Konsep Unlimited', 'Prioritas Pengerjaan', 'Full Source Files', 'Konsultasi Gratis'], isPremium: false, order: 3 }
            ]));

            const [testimonials, setTestimonials] = useState(LocalStorageDB.get('testimonials', [
                { id: '1', name: 'Rian Pratama', city: 'Jakarta', rating: 5, comment: 'Pengerjaan sangat cepat dan hasilnya luar biasa elegan!', image: '' }
            ]));

            const [faq, setFaq] = useState(LocalStorageDB.get('faq', [
                { id: '1', q: 'Berapa lama pengerjaan desain?', a: 'Umumnya memakan waktu 1-2 hari kerja tergantung tingkat kerumitan.', order: 1 }
            ]));

            const [team, setTeam] = useState(LocalStorageDB.get('team', [
                { id: '1', name: 'Tim Pawon Kreatif', role: 'Creative Team', photo: '', bio: 'Tim kreatif Pawon Kreatif siap membantu kebutuhan desain Anda.', order: 1 }
            ]));

            const [orders, setOrders] = useState(LocalStorageDB.get('orders', []));

            useEffect(() => {
                const handleHashChange = () => {
                    const h = window.location.hash.replace('#', '');
                    if(['home','order','admin/login','admin/dashboard'].includes(h)) setRoute(h);
                };
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            useEffect(() => {
                if(route) window.location.hash = route;
                if(route === 'admin/dashboard' && !user) setRoute('admin/login');
            }, [route, user]);

            // Load data from Supabase if configured, otherwise Fallback to LocalStorage
            useEffect(() => {
                const initData = async () => {
                    try {
                        if (supabaseClient) {
                            const { data: { session } } = await supabaseClient.auth.getSession();
                            if (session) {
                                const { data: adminRow } = await supabaseClient.from('admin_users').select('user_id').eq('user_id', session.user.id).maybeSingle();
                                if (adminRow) setUser(session.user);
                                else await supabaseClient.auth.signOut();
                            }

                            const { data: setRes, error: setErr } = await supabaseClient.from('site_settings').select('*').eq('id','main').maybeSingle();
                            if (!setErr && setRes) {
                                setSettings(prev => {
                                    const merged = { ...prev, ...setRes };
                                    LocalStorageDB.set('settings', merged);
                                    return merged;
                                });
                            }

                            const { data: contentRes, error: contentErr } = await supabaseClient.from('content_items').select('*').order('sort_order', { ascending: true });
                            if (!contentErr && contentRes) {
                                const grouped = { services: [], portfolio: [], pricing: [], testimonials: [], faq: [], team: [] };
                                contentRes.forEach(row => { if (grouped[row.collection]) grouped[row.collection].push({ ...(row.data || {}), id: row.id }); });
                                Object.entries(grouped).forEach(([k,v]) => { if (v.length) LocalStorageDB.set(k,v); });
                                if (grouped.services.length) setServices(grouped.services);
                                if (grouped.portfolio.length) setPortfolio(grouped.portfolio);
                                if (grouped.pricing.length) setPricing(grouped.pricing);
                                if (grouped.testimonials.length) setTestimonials(grouped.testimonials);
                                if (grouped.faq.length) setFaq(grouped.faq);
                                if (grouped.team.length) setTeam(grouped.team);
                            }
                            const { data: orderRes, error: orderErr } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
                            if (!orderErr && orderRes) { setOrders(orderRes); LocalStorageDB.set('orders', orderRes); }
                        }
                    } catch (e) { console.warn('Pawon initialization fallback:', e); }
                    setLoading(false);
                };
                initData();
            }, []);

            useEffect(() => {
                document.title = settings.seoTitle || `${settings.brandName || 'Pawon Kreatif'} | Jasa Desain Digital`;
                const meta = document.querySelector('meta[name=description]');
                if (meta) meta.setAttribute('content', settings.seoDescription || 'Jasa desain digital profesional.');
                document.documentElement.style.setProperty('--color-primary', settings.primaryColor || '#3b82f6');
                document.documentElement.style.setProperty('--color-accent', settings.accentColor || '#8b5cf6');
                document.body.style.backgroundImage = settings.bgType === 'solid' ? 'none' : "var(--bg-image, url('https://www.transparenttextures.com/patterns/stardust.png'))";
                if (settings.faviconUrl) {
                    let fav = document.querySelector('link[data-pawon-favicon]');
                    if (!fav) { fav = document.createElement('link'); fav.rel='icon'; fav.dataset.pawonFavicon='1'; document.head.appendChild(fav); }
                    fav.href = settings.faviconUrl;
                }
            }, [settings]);

            const updateData = async (collName, id, newData, isDelete = false) => {
                const listMap = { services, portfolio, pricing, testimonials, faq, orders, team };
                const setterMap = { services: setServices, portfolio: setPortfolio, pricing: setPricing, testimonials: setTestimonials, faq: setFaq, orders: setOrders, team: setTeam };
                const currentList = listMap[collName] || [];
                const itemId = String(id || Date.now());

                if (collName === 'settings') {
                    if (supabaseClient) {
                        const { error } = await supabaseClient.from('site_settings').upsert({ id: 'main', ...newData, updated_at: new Date().toISOString() });
                        if (error) throw error;
                    }
                    setSettings(newData);
                    LocalStorageDB.set('settings', newData);
                    return;
                }

                let nextList;
                if (isDelete) nextList = currentList.filter(item => String(item.id) !== itemId);
                else {
                    const normalized = { ...newData, id: itemId };
                    const exists = currentList.some(item => String(item.id) === itemId);
                    nextList = exists ? currentList.map(item => String(item.id) === itemId ? { ...item, ...normalized } : item) : [...currentList, normalized];
                }

                if (supabaseClient) {
                    if (collName === 'orders') {
                        if (isDelete) {
                            const { error } = await supabaseClient.from('orders').delete().eq('id', itemId);
                            if (error) throw error;
                        } else {
                            const row = { id: itemId, name: newData.name, wa: newData.wa, service: newData.service || null, paket: newData.paket || null, detail: newData.detail, deadline: newData.deadline || null, budget: newData.budget || null, notes: newData.notes || null, attachment_url: newData.attachment_url || null, status: newData.status || 'Baru', date: newData.date || new Date().toISOString(), created_at: newData.created_at || new Date().toISOString(), updated_at: new Date().toISOString() };
                            const { error } = await supabaseClient.from('orders').upsert(row, { onConflict: 'id' });
                            if (error) throw error;
                        }
                    } else {
                        if (isDelete) {
                            const { error } = await supabaseClient.from('content_items').delete().eq('id', itemId).eq('collection', collName);
                            if (error) throw error;
                        } else {
                            const row = { id: itemId, collection: collName, sort_order: Number(newData.order || 0), data: newData, updated_at: new Date().toISOString() };
                            const { error } = await supabaseClient.from('content_items').upsert(row, { onConflict: 'id' });
                            if (error) throw error;
                        }
                    }
                }
                if (setterMap[collName]) {
                    setterMap[collName](nextList);
                    LocalStorageDB.set(collName, nextList);
                }
            };

            const dataUrlToBlob = (dataUrl) => {
                const [meta, body] = String(dataUrl || '').split(',');
                if (!meta || !body) throw new Error('Format file referensi tidak valid.');
                const mime = (meta.match(/data:([^;]+);base64/i) || [,'application/octet-stream'])[1];
                const binary = atob(body);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                return new Blob([bytes], { type: mime });
            };

            const saveNewOrder = async (orderData) => {
                if (!supabaseClient) {
                    throw new Error('Supabase belum terhubung. Periksa config.js: supabaseUrl dan supabaseAnonKey harus benar.');
                }
                const id = `PK-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
                const now = new Date().toISOString();
                let attachmentUrl = null;
                if (orderData.fileBase64) {
                    const blob = dataUrlToBlob(orderData.fileBase64);
                    const path = `orders/${id}.webp`;
                    const { error: uploadErr } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(path, blob, { contentType: 'image/webp', upsert: true });
                    if (uploadErr) throw new Error(`Upload lampiran gagal: ${uploadErr.message}`);
                    const { data: publicData } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);
                    attachmentUrl = publicData?.publicUrl || null;
                }
                const row = {
                    id,
                    name: String(orderData.name || '').trim(),
                    wa: normalizeWhatsApp(orderData.wa),
                    service: orderData.service || null,
                    paket: orderData.paket || null,
                    detail: String(orderData.detail || '').trim(),
                    deadline: orderData.deadline || null,
                    budget: orderData.budget || null,
                    notes: orderData.notes || null,
                    status: 'Baru',
                    attachment_url: attachmentUrl,
                    date: now,
                    created_at: now,
                    updated_at: now
                };
                if (!row.name || !row.wa || !row.detail) throw new Error('Nama, WhatsApp, dan detail pesanan wajib diisi.');
                const { error } = await supabaseClient.from('orders').insert(row);
                if (error) throw new Error(`Supabase orders gagal menyimpan: ${error.message}`);
                setOrders(prev => [row, ...prev]);
                LocalStorageDB.set('orders', [row, ...orders]);
            };

            if (loading) return (
                <div className="min-h-screen bg-dark flex items-center justify-center flex-col gap-6">
                    <div className="w-16 h-16 border-4 border-white/5 border-t-primary border-r-accent rounded-full animate-spin"></div>
                    <div className="text-gray-400 font-medium font-heading tracking-widest text-sm uppercase">Menyiapkan Studio...</div>
                </div>
            );

            if (route.startsWith('admin')) {
                return route === 'admin/dashboard' && user 
                    ? <AdminDashboard stateData={{settings, services, portfolio, pricing, faq, testimonials, orders, team}} updateData={updateData} setRoute={setRoute} onLogout={async () => { if(supabaseClient) await supabaseClient.auth.signOut(); setUser(null); setRoute('home'); }} />
                    : <AdminLogin onLoginSuccess={(u) => setUser(u)} setRoute={setRoute} />;
            }

            if (route === 'order') {
                return <OrderFormPage settings={settings} services={services} pricing={pricing} setRoute={setRoute} onSaveOrder={saveNewOrder} />;
            }

            return (
                <div className="min-h-screen">
                    <Navbar settings={settings} route={route} setRoute={setRoute} />
                    <main>
                        <Hero settings={settings} setRoute={setRoute} />
                        <StudioHighlights settings={settings} setRoute={setRoute} />
                        <About settings={settings} />
                        <TeamSection team={team} />
                        <Services services={services} setRoute={setRoute} />
                        <Portfolio portfolio={portfolio} />
                        <Pricing pricing={pricing} setRoute={setRoute} />
                        <Process />
                        <Testimonials testimonials={testimonials} />
                        <FAQ faq={faq} />
                        <StudioCTA settings={settings} setRoute={setRoute} />
                    </main>
                    <Footer settings={settings} />
                    <FloatingWA waNumber={settings.waNumber} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
